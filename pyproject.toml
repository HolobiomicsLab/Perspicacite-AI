[project]
name = "perspicacite"
version = "2.0.0"
description = "AI-powered scientific literature research assistant"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0",
    "litellm==1.82.3",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "bm25s>=0.2.0",
    "sentence-transformers>=3.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pdfplumber>=0.11.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "bibtexparser>=1.4.0",
    "structlog>=24.0.0",
    "tenacity>=9.0.0",
    "tiktoken>=0.7.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "click>=8.1.0",
    "fastmcp>=3.0.0",   # 3.x: @mcp.tool() with parens + http_app() ASGI mount
    "biopython>=1.80",
    "nltk>=3.8",
    "langchain-text-splitters>=0.3.0",
    "pathspec>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-httpx>=0.30.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pre-commit>=3.8.0",
]
# SciLEx (Science Literature Exploration) — multi-database systematic-
# review toolkit from the Wimmics group at Inria. Crawlers + aggregators
# for Semantic Scholar / OpenAlex / PubMed / arXiv / HAL / DBLP / IEEE /
# Springer. MIT-licensed, currently github-only (no PyPI release).
# Without this extra, the `search_literature` MCP tool returns an
# explicit error pointing the user here.
#
# Install with:
#   uv pip install -e ".[scilex]"
#
# The Wimmics package has ~19 minimum deps and supports Python 3.10+,
# so installation is much lighter than the older datalogism/SciLEx
# fork (73 deps, Python 3.13+).
scilex = [
    "scilex @ git+https://github.com/Wimmics/SciLEx.git",
]

# Browser cookie import (perspicacite import-browser-cookies CLI).
# Reads + decrypts cookies from Chrome/Brave/Firefox/Edge/Safari for
# institutional-access PDF downloads. On macOS the OS may prompt for
# keychain access once when first reading Chromium-family cookies.
cookies = [
    "browser-cookie3>=0.20.0",
]

# Optional Tree-sitter-backed chunker for non-Python code (Go, Rust,
# Java, JS/TS, etc.). When installed, `_chunk_treesitter` uses a
# real parse tree instead of the LangChain splitter fallback.
#
# Install with:
#   uv pip install -e ".[code-parsing]"
code-parsing = [
  "tree-sitter>=0.21",
  "tree-sitter-languages>=1.10",
]

# Optional HTML -> Markdown conversion for URL-to-KB ingest. Without
# this extra the ``ingest_urls_to_kb`` tool falls back to a basic
# BeautifulSoup text extraction (lower quality — boilerplate not
# stripped, no structural awareness).
#
# Install with:
#   uv pip install -e ".[html-ingest]"
html-ingest = [
  "trafilatura>=1.6",
]

# Optional YouTube transcript ingest. Pulls public captions (manual or
# auto-generated) via youtube-transcript-api. No API key required.
# When this extra is installed, ``push_to_zotero`` and
# ``ingest_urls_to_kb`` recognize YouTube URLs and fetch + LLM-correct
# their transcripts for ingest.
#
# Install with:
#   uv pip install -e ".[youtube-ingest]"
youtube-ingest = [
  "youtube-transcript-api>=0.6",
]

# Optional headless Chromium for last-resort title->DOI discovery and
# bot-walled HTML capture. Enabled with `pdf_download.headless_browser:
# true` in config.yml. When absent, the title_resolver and html_capture
# modules silently skip the Chromium tier and use only HTTP-based
# fallbacks.
#
# After installing the extra, also run `playwright install chromium`
# to download the browser binary (~150MB):
#   uv pip install -e ".[browser]"
#   playwright install chromium
browser = [
  "playwright>=1.40",
]

# indicium — Knowledge Graph / SHACL validation layer for structured claim
# representation. Local sibling package (not yet on PyPI). Pulls in linkml,
# pyshacl, and rdflib. Install only when KG-backed workflows are needed.
#
# Local packages are available at ../indicium, ../indicium-adapters, and
# ../indicium-adapters-metabolomics. The `extract_claims_from_passages`
# and `export_astra` MCP tools degrade gracefully without these extras.
#
# Install with:
#   uv sync --extra indicia --extra adapters
indicia = [
  # Floor: 1.8.0 is the first release that ships the verify_quote kernel that
  # the R3 anchor path (anchor_claims / annotate_anchor_status) imports. An
  # older indicium would make anchoring fail-soft to "unchecked" silently.
  "indicium>=1.8.0",
  "pyoxigraph>=0.4",
]

# indicium-adapters — optional domain adapter protocol. Core package (>=0.4.0)
# no longer ships the metabolomics adapters; those live in the sibling package
# indicium-adapters-metabolomics (MetabolomicsAdapter, MetaboKGAdapter,
# EMIAdapter). Both are needed so discover_adapters() returns all three.
# Enables domain_adapter= kwarg in extract_claims().
adapters = [
    "indicium-adapters>=0.4.0",
    "indicium-adapters-metabolomics>=0.1.0",
]

[project.scripts]
perspicacite = "perspicacite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required so the [scilex] extras-group can pull from a git+ URL.
# Hatch refuses direct references by default to keep PyPI uploads
# reproducible; we never publish Perspicacité as a wheel today so
# the protection isn't needed.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/perspicacite"]

[tool.uv]
# Override scilex's transitive httpx<0.28 pin so fastmcp 3.x can resolve.
# Safe while the [scilex] extra is unused by the core / KB / MCP paths.
override-dependencies = ["httpx>=0.28.1"]

[tool.uv.sources]
# Local-path sources for the indicium stack. All three sibling packages are
# available at the paths below (editable installs). Pair with the `indicia`
# and `adapters` extras above: uv sync --extra indicia --extra adapters
indicium = { path = "../indicium", editable = true }
indicium-adapters = { path = "../indicium-adapters", editable = true }
indicium-adapters-metabolomics = { path = "../indicium-adapters-metabolomics", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests (no external services)",
    "integration: Integration tests (may need services)",
    "live: Tests requiring API keys (deselect with -m 'not live')",
    "slow: Slow tests, opt-in or excluded in fast runs",
    "smoke: MCP tool inventory smoke tests (fast, no real I/O)",
    "config: Config loading audit tests (fast, no LLM calls, small YAML reads only)",
    "e2e: End-to-end pipeline tests (Wave 6.1, mocked LLM + embedder)",
    "perf: Performance regression tests (Wave 6.3, baseline comparison)",
]
filterwarnings = [
    # rdflib 7.x internally accesses deprecated Dataset.default_context
    # and Dataset.contexts — nothing we can fix upstream.
    "ignore::DeprecationWarning:rdflib.*",
    # indicium-adapters: claim_to_insight() in mcp/server.py calls the
    # old indicium.claim_to_insight shim (still functional, migration TBD).
    "ignore:indicium.adapters.astra.claim_to_insight.*:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"  # matches requires-python = ">=3.12"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TC", "RUF"]
ignore = [
    # --- Owned by `ruff format` (see line-length above) -------------------
    # We don't also gate the lint check on layout/whitespace rules that the
    # formatter is the single source of truth for. The pre-commit ruff-format
    # hook cleans these on every touched file.
    "E501",   # line-too-long
    "W291",   # trailing whitespace
    "W293",   # blank line with whitespace
    "E701",   # multiple statements on one line (colon)
    "E702",   # multiple statements on one line (semicolon)
    # --- Domain false-positives -------------------------------------------
    # Ambiguous-unicode: this is a scientific + French codebase. µ, °, ×, –,
    # α/β and accented French text are intentional notation, not typos.
    "RUF001",  # ambiguous char in a string
    "RUF002",  # ambiguous char in a docstring
    "RUF003",  # ambiguous char in a comment
    # Pydantic and FastAPI resolve type annotations at *runtime*, so moving
    # imports into `if TYPE_CHECKING:` blocks (what these rules want) breaks
    # model/route annotation resolution. Keep the imports at module scope.
    "TC001",  # typing-only first-party import
    "TC002",  # typing-only third-party import
    "TC003",  # typing-only standard-library import
    # Scientific variable names (T, pH, Kd, dG, ...) are domain-conventional.
    "N806",   # non-lowercase variable in function
    "N814",   # camelcase imported as constant (e.g. `as ET`, `as np`)
    # Nested `with` blocks are acceptable and often clearer than a single
    # parenthesized context manager; not worth mechanical churn to combine.
    "SIM117",  # multiple-with-statements
    # Likewise, a nested `if A: if B:` is often clearer than collapsing into a
    # single 3-4 term boolean chain (the remaining sites read better nested).
    "SIM102",  # collapsible-if
    # Module-level imports placed after code are intentional here: a logging
    # bootstrap (web/app.py, logging.py must configure structlog before
    # importing anything that binds a logger at import time) and a
    # pure-functions-before-heavy-imports layout in the cache modules. None
    # are bugs; mechanically hoisting them risks the bootstrap ordering.
    "E402",   # module-import-not-at-top-of-file
    # `(str, Enum)` is deliberate: these enums are serialised to JSON and
    # compared as strings across the API/MCP boundary. Switching to `StrEnum`
    # (what UP042 wants) changes `str()`/format/JSON semantics and would break
    # wire compatibility. Keep the explicit mixin.
    "UP042",  # replace-str-enum
]

[tool.ruff.lint.per-file-ignores]
# FastAPI puts callables (File/Query/Form/Depends) in argument defaults by
# design, so B008 (function-call-in-default) is a false positive for handlers.
"src/perspicacite/web/routers/*" = ["B008"]
# Test code has different conventions than library code. These rules are
# idiomatic noise in tests, not signal:
#   N802  - descriptive capitalised test names (test_..._AU, ..._HEAD encode
#           the field/SHA under test on purpose).
#   N818  - fake exception classes (FakeAuth, _AuthFail) deliberately omit the
#           "Error" suffix to read as stubs, not real error types.
#   E741  - `for l in lines:` when parsing fixture text line-by-line.
#   B017  - `pytest.raises(Exception)` is sometimes the point of the assertion.
#   RUF012- mutable class attrs on mock/recorder fixture classes are harmless.
#   SIM115- short-lived `open()` in a test body doesn't need a context manager.
"tests/**" = ["N802", "N818", "E741", "B017", "RUF012", "SIM115"]

[tool.mypy]
python_version = "3.12"
# Pragmatic-but-enforced (was blanket `strict = true`). We keep mypy's
# *semantic* bug-catchers — the checks that find real defects — and check the
# bodies of unannotated functions, but we deliberately do NOT gate on
# annotation-completeness rules (every def fully typed, every generic
# parameterised, every return narrowed). In a large research codebase those
# produce churn without proportional safety. The bug-catchers stay on by
# mypy default; the four noisy completeness flags below are explicitly off.
check_untyped_defs = true       # check bodies of unannotated fns (where many real bugs hide)
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true      # keep `# type: ignore` comments honest
strict_equality = true          # flag non-overlapping-type comparisons
# Off — annotation-completeness noise, not bug signal:
disallow_untyped_defs = false       # was -> no-untyped-def
disallow_incomplete_defs = false    # was -> no-untyped-def
disallow_untyped_calls = false      # was -> no-untyped-call
disallow_any_generics = false       # was -> type-arg
warn_return_any = false             # was -> no-any-return

[[tool.mypy.overrides]]
# Untyped / stubless third-party deps we don't control. Pulling in stub
# packages (types-pandas, types-lxml, types-PyYAML, ...) for each is out of
# scope for this hardening pass; suppress missing-import noise instead.
module = [
    "bibtexparser.*",
    "bm25s.*",
    "browser_cookie3.*",
    "fitz.*",
    "indicium.*",
    "indicium_adapters.*",
    "lxml.*",
    "pandas.*",
    "pyoxigraph.*",
    "pytesseract.*",
    "rank_bm25.*",
    "rdflib.*",
    "scilex.*",
    "yaml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# indicium_layer.store types its SPARQL result loop against rdflib, which only
# ships with the `indicia` extra. CI's lint env installs base deps only, so
# rdflib resolves to Any there and a `# type: ignore[union-attr]` that is
# genuinely *needed* in a full local/indicia checkout reads as *unused* in CI.
# The divergence is expected — don't gate on unused-ignore for this module.
module = ["perspicacite.indicium_layer.store"]
warn_unused_ignores = false

[tool.coverage.run]
source = ["src/perspicacite"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 70

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-httpx>=0.36.2",
    "pytest-timeout>=2.4.0",
    "respx>=0.23.1",
]
